<script>
'use strict';
/* ==========================================================================
   Dustwell Shooter — core: canvas, sprites, text, audio, input, save
   Art & sound: Kenney "Desert Shooter Pack" (CC0)
   ========================================================================== */
const MW = 460, MH = 258, T = 16;
const QUEST_MS = 20 * 60 * 1000;
const P = {
  dark: '#47324b', white: '#ffffff', red: '#dd674c', redL: '#f78d68', redD: '#b94f37',
  lav: '#999ac4', lavL: '#c3c6e9', lavD: '#81759b', yel: '#ffb84c', yelL: '#ffde8c', yelD: '#ec9a1e',
  blue: '#778fdb', blueL: '#a1b6f5', sand: '#f3cdac', sandD: '#dfa988', sandL: '#fbe5c9',
  purp: '#a386ce', teal: '#7bd8c4', tealD: '#63b8a6', dust: '#dfa988'
};
const FONT = '"Poppins", "Segoe UI", system-ui, -apple-system, sans-serif';

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const R = Math.random;
const rint = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
function fmtTime(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

/* ---------------- canvas ---------------- */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let CW = 1, CH = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  CW = Math.max(1, Math.round(window.innerWidth * DPR));
  CH = Math.max(1, Math.round(window.innerHeight * DPR));
  cv.width = CW; cv.height = CH;
}
window.addEventListener('resize', resize);
resize();

/* menu space: 460x258 art pixels, centered and scaled */
const M = { s: 1, ox: 0, oy: 0 };
function menuXf() {
  let s = Math.min(CW / MW, CH / MH);
  if (s >= 2) s = Math.floor(s);
  M.s = s; M.ox = Math.round((CW - MW * s) / 2); M.oy = Math.round((CH - MH * s) / 2);
  ctx.setTransform(s, 0, 0, s, M.ox, M.oy);
  ctx.imageSmoothingEnabled = false;
}
const toMenu = (x, y) => [(x - M.ox) / M.s, (y - M.oy) / M.s];

/* ---------------- sprites ---------------- */
const SHEET = {};
const SHEET_DEF = { tiles: [16, 18], ui: [16, 18], players: [24, 4], enemies: [24, 4], weapons: [24, 10] };
function loadImages() {
  return Promise.all(Object.keys(SHEET_DEF).map(k => new Promise(res => {
    const img = new Image();
    img.onload = () => { SHEET[k] = { img, ts: SHEET_DEF[k][0], cols: SHEET_DEF[k][1] }; res(); };
    img.onerror = () => res();
    img.src = ASSETS.img[k];
  })));
}
function makeWhite(k) {
  const s = SHEET[k]; const c = document.createElement('canvas');
  c.width = s.img.width; c.height = s.img.height;
  const g = c.getContext('2d'); g.drawImage(s.img, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  SHEET[k + 'W'] = { img: c, ts: s.ts, cols: s.cols };
}
/* draw a tile; (x,y) = top-left of the (scaled) tile box */
function spr(k, i, x, y, o) {

const SAVE_KEY = 'dustwell-shooter-save-v1';
let SAVE = null;
function defaultSave() {
  const now = Date.now();
  return {
    v: 1, created: now, savedAt: 0, gold: 0, owned: new Array(16).fill(0), equipped: -1, page: 0,
    cleared: new Array(50).fill(0), best: new Array(50).fill(0),
    stats: { kills: 0, goldEarned: 0, goldSpent: 0, chests: 0, deaths: 0, quests: 0, bosses: 0, playTime: 0, runs: 0 },
    npcs: { cat: { next: now, quest: null, count: 0 }, mouse: { next: now + QUEST_MS, quest: null, count: 0 } },
    settings: { sfx: 0.8, music: 0.45, shake: 1, nums: 1 }

}
function normalizeSave(s) {
  const d = defaultSave();

  for (const k in d) {
    if (s[k] === undefined || s[k] === null && d[k] !== null) continue;
    if (Array.isArray(d[k])) { if (Array.isArray(s[k])) d[k] = d[k].map((v, i) => (s[k][i] !== undefined ? s[k][i] : v)); }
    else if (typeof d[k] === 'object' && d[k]) { if (typeof s[k] === 'object') { for (const j in d[k]) if (s[k][j] !== undefined) d[k][j] = s[k][j]; } }
    else d[k] = s[k];
  }
  for (const n of ['cat', 'mouse']) { const o = d.npcs[n]; if (typeof o !== 'object' || !o) d.npcs[n] = defaultSave().npcs[n]; }

}

}

  async init() {
    try {

      if (!db || !user) return;

function tileImg(i) { const s = SHEET.tiles; return [(i % 18) * 16, Math.floor(i / 18) * 16]; }

/* shared clickable-area plumbing for menu scenes */
class MenuScene {
  constructor() { this.hot = []; this.t = 0; this.tip = null; }
  hit(x, y, w, h, fn, tip) {
    this.hot.push({ x, y, w, h, fn });
    if (topScene() !== this || IN.touch) return false;
    const [mx, my] = toMenu(IN.mx, IN.my);
    const on = mx >= x && my >= y && mx < x + w && my < y + h;
    if (on) { this.anyHover = true; if (tip) this.tip = tip; }
    return on;
  }
  begin() { this.hot = []; this.tip = null; this.anyHover = false; menuXf(); }
  end() {
    if (topScene() === this) {

    }
  }
  click(px, py) {
    const [mx, my] = toMenu(px, py);
    for (let i = this.hot.length - 1; i >= 0; i--) {
      const h = this.hot[i];

}

function npcTip(id) {
  const n = SAVE.npcs[id], q = n.quest, N = NPCS[id];
  if (!q) return [N.name + ' ' + N.title, 'Next job in ' + fmtTime(n.next - Date.now())];
  if (q.status === 'offered') return [N.name + ' ' + N.title, 'Has a new job for you!'];
  if (q.status === 'done') return [N.name + ' ' + N.title, 'Job done. Click to claim ' + q.reward + ' gold.'];
  return [N.name + ' ' + N.title, questText(q).goal, `Progress ${q.prog} / ${q.n}`];
}
function radarTip() {
  const out = ['Job radar'];
  for (const id of ['cat', 'mouse']) {
    const n = SAVE.npcs[id], q = n.quest;
    out.push(NPCS[id].name + ': ' + (!q ? 'next job in ' + fmtTime(n.next - Date.now()) : q.status === 'offered' ? 'new job waiting' : q.status === 'done' ? 'reward ready' : `${q.prog}/${q.n} ${questText(q).goal.toLowerCase()}`));
  }
  return out;
}
function weaponTip(wi) {
  const w = WEAPONS[wi], owned = SAVE.owned[wi];
  const dps = (w.dmg * w.pellets * w.rate).toFixed(0);
  const status = owned ? (SAVE.equipped === wi ? 'Equipped' : 'Owned. Click to equip.')
    : !canBuy(wi) ? `${w.price} gold. ` + lockReason(wi)
    : `Price: ${w.price} gold` + (SAVE.gold >= w.price ? '. Click to buy.' : ` (you have ${SAVE.gold})`);
  return [w.name, status,
    `Damage ${w.dmg}${w.pellets > 1 ? ' x' + w.pellets : ''}, ${w.rate} shots/s, ${w.mag} rounds`, `Raw damage per second: ${dps}` + (w.pierce ? ', pierces' : '') + (w.splash ? ', splash' : '')];
}
function lockReason(wi) { return wi >= ORANGE_N && !allOrange() ? 'Own every orange weapon first.' : `Buy the ${WEAPONS[wi - 1].name} first.`; }
function armoryClick(wi) {
  const w = WEAPONS[wi];
  if (SAVE.owned[wi]) { SAVE.equipped = SAVE.equipped === wi ? -1 : wi; persist(); Game.toast(SAVE.equipped === wi ? w.name + ' equipped' : 'Knife only. Weapon holstered.'); return; }
  if (!canBuy(wi)) { sfx('error-a'); Game.toast(lockReason(wi)); return; }
  if (SAVE.gold < w.price) { sfx('error-a'); Game.toast(`${w.name} costs ${w.price} gold. You have ${SAVE.gold}.`); return; }
  pushScene(new Confirm(`Buy the ${w.name}?`, `${w.price} gold. You have ${SAVE.gold}.`, 'Buy', () => {
    SAVE.gold -= w.price; SAVE.stats.goldSpent += w.price; SAVE.owned[wi] = 1; SAVE.equipped = wi; persist();
    sfx('coin-d'); Game.toast(w.name + ' bought and equipped');
  }));
}

  /* ---------- helpers ---------- */

  /* ---------- combat ---------- */

  /* ---------- update ---------- */
  update(dt) {

    Music.intensity = 1;

      if (this.bossDef && !this.bossSpawned && this.killed >= Math.ceil(this.total / 2)) this.spawnBoss();

      if (done) {
        this.state = 'clear';
        this.portal = { x: m.spawn.x * T + 8, y: m.spawn.y * T + 8 };
        this.banner = { lines: ['LEVEL CLEAR'], sub: 'Step into the portal by your start point', t: 3, kind: 'red' };
        sfx('coin-d', 0.9); this.coins.forEach(c => { c.mag = true; });

  drawBullet(b, enemy) {
    const a = Math.atan2(b.vy, b.vx), x = b.x, y = b.y;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    const R2 = (w, h, c) => { ctx.fillStyle = c; ctx.fillRect(-w / 2, -h / 2, w, h); };
    if (enemy) {
      if (b.kind === 'fire') { const f = Math.floor(this.t * 20) % 2; R2(7, 7, P.dark); R2(5, 5, P.red); R2(3, 3, f ? P.yel : P.yelL); }
      else { R2(7, 5, P.dark); R2(5, 3, P.redL); R2(3, 1, P.white); }
    } else if (b.kind === 'laser') { R2(9, 4, P.dark); R2(7, 2, P.teal); R2(5, 1, P.white); }
    else if (b.kind === 'tracer') { R2(14, 3, P.dark); R2(12, 1, P.white); }
    else if (b.kind === 'plasma') { R2(8, 8, P.dark); R2(6, 6, P.purp); R2(3, 3, P.white); }
    else if (b.kind === 'pellet') { R2(4, 4, P.dark); R2(2, 2, P.yelL); }
    else { R2(7, 4, P.dark); R2(5, 2, P.yel); R2(2, 2, P.white); }
    ctx.restore();
  }
  drawHud() {
    const u = this.hudScale(); ctx.setTransform(u, 0, 0, u, 0, 0); ctx.imageSmoothingEnabled = false;
    const HW = CW / u, HH = CH / u, p = this.p;
    // health + gold
    bar(6, 6, 84, 12, p.hp / p.maxHp, 'red', 5);
    bar(92, 6, 18, 12, p.shield / p.maxShield, 'blue', 1);
    spr('tiles', 225, 3, 19); ptext(String(SAVE.gold), 18, 20, 'A');
    // level info
    const left = Math.max(0, this.total - this.killed) + (this.bossDef && !this.bossDead ? 1 : 0);
    stextO(`Level ${this.L}: ${this.def.name}`, HW / 2, 10, 6.4, P.white, P.dark, 'center', 700, 2.2);
    stextO(this.state === 'clear' ? 'Find the portal' : `Monsters left: ${left}`, HW / 2, 20, 5.4, P.yelL, P.dark, 'center', 700, 2);
    // minimap (round frame)
    this.drawMinimap(HW - 54, 4);
    // jobs
    let jy = 60;
    for (const id of ['cat', 'mouse']) {
      const q = SAVE.npcs[id].quest; if (!q || q.status === 'offered') continue;
      const s = q.status === 'done' ? `${NPCS[id].name}: job done!` : `${NPCS[id].name}: ${q.prog}/${q.n} ${shortGoal(q)}`;
      stextO(s, HW - 6, jy, 5, q.status === 'done' ? P.yel : P.white, P.dark, 'right', 600, 2); jy += 9;
    }
    // weapon box
    panel('blue', 4, HH - 40, 92, 34, false);
    if (p.wi >= 0) {
      const w = WEAPONS[p.wi];
      spr('weapons', w.tile, 10, HH - 35);
      stextO(w.name, 36, HH - 28, 5.2, P.white, P.dark, 'left', 700, 2);
      stextO(p.reload > 0 ? 'Reloading' : `${p.ammo} / ${w.mag}`, 36, HH - 18, 5.6, p.ammo === 0 || p.reload > 0 ? P.yelL : P.white, P.dark, 'left', 700, 2);
    } else {
      spr('weapons', KNIFE.tile, 10, HH - 35);
      stextO('Knife', 36, HH - 28, 5.2, P.white, P.dark, 'left', 700, 2);
      stextO('Buy guns in town', 36, HH - 18, 4.6, P.white, P.dark, 'left', 600, 2);
    }
    // boss bar
    if (this.bossEnt && !this.bossEnt.dead) {
      const e = this.bossEnt, w = Math.min(220, HW - 220);
      ptext(e.name.toUpperCase(), HW / 2, HH - 34, 'B', 'center');
      bar(HW / 2 - w / 2, HH - 20, w, 12, e.hp / e.maxHp, 'red');
    }
    // banner
    if (this.banner && !this.result) {
      const b = this.banner, a = clamp(b.t / 0.35, 0, 1), lw = Math.max(...b.lines.map(l => ptW(l, 'B'))) + 40, bh = 30 + b.lines.length * 15;
      ctx.globalAlpha = a;
      const bx = HW / 2 - lw / 2, by = HH * 0.28 - bh / 2;
      panel('red', bx, by, lw, bh);
      b.lines.forEach((l, k) => ptext(l, HW / 2, by + 12 + k * 15, 'B', 'center'));
      stextO(b.sub, HW / 2, by + bh + 9, 6, P.white, P.dark, 'center', 700, 2.2);
      ctx.globalAlpha = 1;
    }
    // touch hints / pause icon
    if (IN.touch) {
      ctx.globalAlpha = 0.6; btn('grey', HW - 22, HH - 24, 18, 18, false); stext('II', HW - 13, HH - 15.5, 6, P.dark, 'center', 700); ctx.globalAlpha = 1;
      if (this.tMove && IN.touches[this.tMove]) { const o = IN.touches[this.tMove]; ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(o.sx / u, o.sy / u, 22, 0, TAU); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(o.x / u, o.y / u, 7, 0, TAU); ctx.fill(); }
    }
    // overlays
    this.hot = [];
    if (this.paused) this.drawPause();
    else if (this.result) this.drawResult();
    else if (!IN.touch && !p.dead) { cv.style.cursor = 'none'; spr('weapons', p.reload > 0 ? 29 : 25, IN.mx / u - 12, IN.my / u - 12); }
  }
  drawMinimap(x, y) {
    const rd = [0, 1, 2, 18, 19, 20, 36, 37, 38];
    for (let k = 0; k < 9; k++) spr('ui', rd[k], x + (k % 3) * 16, y + Math.floor(k / 3) * 16);
    const cx = x + 24, cy = y + 24, r = 17, k = 5, p = this.p, m = this.map;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip();
    ctx.fillStyle = P.sand; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(m.canvas, p.x - r * k, p.y - r * k, r * 2 * k, r * 2 * k, cx - r, cy - r, r * 2, r * 2);
    ctx.imageSmoothingEnabled = false;
    const dot = (wx, wy, c, s = 2) => { const dx = (wx - p.x) / k, dy = (wy - p.y) / k; if (dx * dx + dy * dy < (r - 1) * (r - 1)) { ctx.fillStyle = P.dark; ctx.fillRect(Math.round(cx + dx) - s / 2 - 0.5, Math.round(cy + dy) - s / 2 - 0.5, s + 1, s + 1); ctx.fillStyle = c; ctx.fillRect(Math.round(cx + dx) - s / 2, Math.round(cy + dy) - s / 2, s, s); } };
    for (const c of this.chests) if (!c.open) dot(c.x, c.y, P.yel);
    for (const e of this.ents) if (!e.dead) dot(e.x, e.y, e.boss ? P.white : P.red, e.boss ? 3 : 2);
    if (this.portal) dot(this.portal.x, this.portal.y, P.purp, 3);
    ctx.restore();
    spr('ui', 74, cx - 8, cy - 8, { rot: p.aim + Math.PI / 2, scale: 0.75 });
  }
  overlayBtn(kind, x, y, w, h, label, fn) {
    const [mx, my] = toMenu(IN.mx, IN.my), on = !IN.touch && mx >= x && my >= y && mx < x + w && my < y + h;
    this.hot.push({ x, y, w, h, fn });
    btn(kind, x, y - (on ? 1 : 0), w, h);
    stext(label, x + w / 2, y + h / 2 - 0.5 - (on ? 1 : 0), BTN_FONT, kind === 'red' ? P.white : P.dark, 'center', 600);
    return on;
  }
  drawPause() {
    cv.style.cursor = 'default'; dim(); menuXf();
    const x = 150, y = 50, w = 160, h = 150;
    panel('grey', x, y, w, h);
    ptext('PAUSED', x + w / 2, y + 12, 'B', 'center');
    let any = false;
    any = this.overlayBtn('red', x + 30, y + 40, 100, 21, 'Resume', () => { this.paused = false; }) || any;
    any = this.overlayBtn('grey', x + 30, y + 66, 100, 21, 'Restart level', () => startLevel(this.li)) || any;
    any = this.overlayBtn('grey', x + 30, y + 92, 100, 21, 'Back to town', () => this.toTown()) || any;
    stext('Gold you picked up is already saved.', x + w / 2, y + 128, 4.8, P.dark, 'center', 500);
    cv.style.cursor = any ? 'pointer' : 'default';
  }
  drawResult() {
    dim(); menuXf();
    const r = this.result, x = 120, y = 36, w = 220, h = 182;
    panel('grey', x, y, w, h);
    panel('red', x + 20, y - 10, w - 40, 30);
    ptext(r.won ? 'LEVEL CLEAR' : 'YOU DIED', x + w / 2, y - 1, 'B', 'center');
    const rows = [['Level', `${this.L}: ${this.def.name}`], ['Gold collected', '+' + this.goldRun], ['Monsters defeated', this.killsRun], ['Chests opened', this.chestsRun], ['Hits taken', this.hits], ['Time', fmtTime(this.time * 1000)]];
    rows.forEach((row, k) => { stext(row[0], x + 22, y + 34 + k * 11, 5.6, P.dark, 'left', 500); stext(String(row[1]), x + w - 22, y + 34 + k * 11, 5.6, P.dark, 'right', 700); });
    if (r.won && r.first && this.L < LEVEL_N) stext(`Level ${this.L + 1} unlocked!`, x + w / 2, y + 104, 6, P.redD, 'center', 700);
    if (r.won && this.L === LEVEL_N) stext('The Sand Tyrant is defeated. Dustwell is safe!', x + w / 2, y + 104, 5.6, P.redD, 'center', 700);
    if (!r.won) stext('Your gold is kept. Try again or gear up in town.', x + w / 2, y + 104, 5.4, P.redD, 'center', 600);
    let any = false;
    if (r.won && this.L < LEVEL_N) any = this.overlayBtn('red', x + 16, y + h - 58, 90, 21, 'Next level', () => startLevel(this.li + 1)) || any;
    else any = this.overlayBtn('red', x + 16, y + h - 58, 90, 21, r.won ? 'Play again' : 'Retry', () => startLevel(this.li)) || any;
    any = this.overlayBtn('grey', x + w - 106, y + h - 58, 90, 21, 'Back to town', () => this.toTown()) || any;
    any = this.overlayBtn('grey', x + w / 2 - 45, y + h - 32, 90, 21, 'Level select', () => { this.toTown(); openLevels(); }) || any;
    cv.style.cursor = any ? 'pointer' : 'default';
  }
}
function shortGoal(q) {
  switch (q.type) {
    case 'kill': return MONSTERS[q.mon].plural;
    case 'killAny': return 'monsters';
    case 'weapon': return 'with ' + WEAPONS[q.w].name;
    case 'chests': return 'chests';
    case 'gold': return 'gold';
    case 'clear': return 'clear Lv ' + q.lvl + '+';
    case 'boss': return bossName(q.lvl);
    case 'flawless': return 'clean run Lv ' + q.lvl + '+';
  }
  return '';
}

/* ==========================================================================
   Boot & main loop
   ========================================================================== */
async function boot(hotData) {
  const local = loadLocal(), hot = hotData && hotData.save;
  SAVE = normalizeSave(hot && (!local || (hot.savedAt || 0) >= (local.savedAt || 0)) ? hot : local);
  if (!SAVE.savedAt) persist();
  await loadImages();
  makeWhite('enemies'); makeWhite('players');
  buildGlyphs();
  try { await Promise.race([document.fonts.load('600 20px Poppins'), new Promise(r => setTimeout(r, 1500))]); } catch (e) { /* fallback font */ }
  calibrateFont();
  const bootEl = document.getElementById('boot'); if (bootEl) bootEl.remove();
  questTick();
  setScene(new Home());
  Cloud.init();
  setInterval(questTick, 1000);
  let last = performance.now();
  const frame = now => {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    try {
      for (const s of SCENES.slice()) if (s.update) s.update(dt);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      for (const s of SCENES.slice()) s.draw();
      drawToasts(dt);
    } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
(function start() {
  const H = window.claude && window.claude.hot;
  try { if (H && H.snapshot) H.snapshot(() => ({ save: SAVE })); } catch (e) { /* viewer hook unavailable */ }
  if (H && H.ready) H.ready(boot); else boot((H && H.data) || {});
})();

</script>
